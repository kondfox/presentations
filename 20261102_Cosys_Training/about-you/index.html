<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About you — AI Training session</title>
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/deck.css">
<style>
  /* ---------- Slide 1: the question ---------- */
  .q-top { display: flex; justify-content: space-between; align-items: center; }
  .q-top img { height: 46px; }
  .question {
    position: absolute; left: 96px; top: 50%; transform: translateY(-46%);
    font-family: var(--display); font-weight: 700; letter-spacing: -.045em; line-height: .9; font-size: 156px; margin: 0;
  }
  .question .l { display: block; overflow: hidden; padding-bottom: .2em; margin-bottom: -.15em; }
  .question .l > span { display: inline-block; transform: translateY(108%); }
  .active .question .l > span { animation: rise 1.1s var(--d) var(--ease-out) forwards; }
  @keyframes rise { to { transform: none; } }
  .question .muted { color: var(--muted); }

  .qmark {
    position: absolute; left: 1000px; top: 50%; translate: 0 -50%;
    font-family: var(--display); font-weight: 700; font-size: 820px; line-height: 1;
    opacity: 0; pointer-events: none;
  }
  .active .qmark { animation: qin 1.6s .5s var(--ease-out) forwards; }
  @keyframes qin { from { opacity: 0; transform: translateX(60px) scale(.95); } to { opacity: 1; transform: none; } }

  /* the glyph itself: swings like a pendulum around its dot, bobs, and its inner glow drifts */
  .qmark .q {
    display: block; position: relative; transform-origin: 50% 82%;
    color: transparent; -webkit-text-stroke: 2px rgba(139,123,255,.38);
    animation: qswing 11s ease-in-out infinite;
  }
  @keyframes qswing {
    0%   { transform: rotate(5deg) translateY(0); }
    25%  { transform: rotate(8deg) translateY(-12px); }
    50%  { transform: rotate(3deg) translateY(4px); }
    75%  { transform: rotate(7deg) translateY(-8px); }
    100% { transform: rotate(5deg) translateY(0); }
  }
  .qmark .q::after { /* soft fill glow inside the outline, drifting */
    content: "?"; position: absolute; inset: 0; color: transparent; -webkit-text-stroke: 0;
    background: radial-gradient(circle, rgba(124,243,208,.30), rgba(139,123,255,.16) 35%, transparent 60%) no-repeat;
    background-size: 160% 160%;
    -webkit-background-clip: text; background-clip: text;
    animation: qglow 8s ease-in-out infinite alternate;
  }
  @keyframes qglow { from { background-position: 20% 0%; } to { background-position: 80% 100%; } }

  /* ---------- Slide 2: the AI box ---------- */
  @property --heat { syntax: '<number>'; inherits: true; initial-value: 0; }
  .scene { position: absolute; inset: 0; --heat: 0; transition: --heat .6s ease-out; cursor: pointer; }
  .scene .center { position: absolute; left: 800px; top: 470px; width: 0; height: 0; }

  .rays {
    position: absolute; left: -700px; top: -700px; width: 1400px; height: 1400px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,214,140,.22) 0deg 4deg, transparent 4deg 18deg);
    mask-image: radial-gradient(circle, #000 0%, transparent 62%); -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%);
    opacity: calc(var(--heat) * 1.1); animation: turn 24s linear infinite;
  }
  @keyframes turn { to { rotate: 360deg; } }
  .halo {
    position: absolute; left: -330px; top: -330px; width: 660px; height: 660px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,190,110,.55), rgba(255,107,181,.18) 40%, transparent 68%);
    opacity: calc(.15 + var(--heat) * .85); scale: calc(.7 + var(--heat) * .5); filter: blur(10px);
  }

  .boxwrap { position: absolute; left: 0; top: 0; perspective: 1400px; }
  .shadow {
    position: absolute; left: -170px; top: 150px; width: 340px; height: 60px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,.65), transparent 70%);
  }
  .cube {
    position: absolute; left: -120px; top: -120px; width: 240px; height: 240px;
    transform-style: preserve-3d; transform: rotateX(-22deg) rotateY(-36deg);
  }
  .face {
    position: absolute; inset: 0; border-radius: 6px;
    background: linear-gradient(150deg, #23283a, #12141e 70%);
    border: 2px solid rgba(124,243,208, calc(.25 + var(--heat) * .75));
    box-shadow:
      0 0 calc(4px + var(--heat) * 46px) rgba(255,200,120, calc(var(--heat) * .9)),
      inset 0 0 50px rgba(139,123,255,.12);
    backface-visibility: visible;
  }
  .face.front  { transform: translateZ(120px); display: grid; place-items: center; }
  .face.back   { transform: rotateY(180deg) translateZ(120px); }
  .face.right  { transform: rotateY(90deg) translateZ(120px); background: linear-gradient(150deg, #1a1e2c, #0d0f17 70%); }
  .face.left   { transform: rotateY(-90deg) translateZ(120px); }
  .face.bottom { transform: rotateX(-90deg) translateZ(120px); }
  .face.lid    { transform: rotateX(90deg) translateZ(120px); inset: -6px; background: linear-gradient(150deg, #2b3146, #181b28 70%); }
  .face.right::after, .face.lid::after { /* faint ribbing */
    content: ""; position: absolute; inset: 14px; border-radius: 4px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 22px);
  }
  .face.lid::before { /* tape stripe */
    content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 46px; margin-left: -23px;
    background: linear-gradient(var(--mint), #4fd8b4); opacity: .85;
  }
  .face.front .ai {
    font-family: var(--display); font-weight: 700; font-size: 128px; letter-spacing: -.04em; line-height: 1;
  }

  .core {
    position: absolute; left: 0; top: 0; translate: -50% -50%; opacity: 0; pointer-events: none;
    font-family: var(--display); font-weight: 700; font-size: 210px; letter-spacing: -.05em; line-height: 1;
    filter: drop-shadow(0 0 40px rgba(139,123,255,.55));
  }
  .core.on { animation: corepulse 3.2s ease-in-out infinite alternate; }
  @keyframes corepulse { from { filter: drop-shadow(0 0 28px rgba(139,123,255,.45)); } to { filter: drop-shadow(0 0 60px rgba(124,243,208,.65)); } }

  .ring {
    position: absolute; left: -100px; top: -100px; width: 200px; height: 200px; border-radius: 50%;
    border: 3px solid rgba(255,230,180,.9); opacity: 0; pointer-events: none;
  }
  .flash { position: absolute; inset: 0; background: radial-gradient(circle at 800px 470px, #fff 0%, rgba(255,240,210,.7) 20%, transparent 60%); opacity: 0; pointer-events: none; }
  canvas.fx { position: absolute; inset: 0; width: 1600px; height: 900px; pointer-events: none; }

  .idea { position: absolute; left: 0; top: 0; pointer-events: none; }
  .idea .bob { animation: bob var(--bd) var(--bdel) ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translate(0, -6px) rotate(calc(var(--tilt) - 2deg)); } to { transform: translate(4px, 7px) rotate(calc(var(--tilt) + 2deg)); } }
  .chip {
    translate: -50% -50%; display: inline-flex; align-items: center; gap: 12px; white-space: nowrap;
    padding: 12px 22px 12px 16px; border-radius: 999px;
    font-family: var(--display); font-weight: 700; font-size: 27px; letter-spacing: -.01em; color: #0b0c12;
    background: hsl(var(--h) 88% 66%);
    box-shadow: 0 14px 34px -12px hsl(var(--h) 90% 55% / .8), inset 0 -3px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.35);
  }
  .chip .e { font-size: 30px; line-height: 1; }
  .bubble {
    translate: -50% -50%; width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; font-size: 40px;
    background: radial-gradient(circle at 32% 28%, hsl(var(--h) 100% 86%), hsl(var(--h) 80% 58%) 60%, hsl(var(--h) 70% 40%));
    box-shadow: 0 14px 34px -10px hsl(var(--h) 90% 55% / .8);
  }
  .hint {
    position: absolute; left: 50%; bottom: 84px; translate: -50% 0; font-size: 13px; color: var(--faint);
    opacity: 0; transition: opacity .6s;
  }
  .scene.done .hint { opacity: 1; }

  /* after the burst: ideas step back, the message comes forward */
  #ideas { transition: opacity 1.2s, filter 1.2s, transform 1.4s var(--ease-out); transform-origin: 800px 470px; }
  .scene.headline #ideas { opacity: .2; filter: blur(2.5px); transform: scale(1.1); }
  .msg { position: absolute; left: 0; right: 0; top: 285px; text-align: center; pointer-events: none; }
  .msg::before { content: ""; position: absolute; left: 50%; top: 50%; width: 1500px; height: 520px; translate: -50% -50%; z-index: -1;
                 background: radial-gradient(ellipse at center, rgba(7,8,12,.85) 25%, transparent 70%); opacity: 0; transition: opacity 1s; }
  .scene.headline .msg::before { opacity: 1; }
  .msg h3 { font-family: var(--display); font-weight: 700; font-size: 86px; letter-spacing: -.035em; line-height: 1.04; margin: 0; }
  .msg .ln { display: block; opacity: 0; transform: translateY(30px); }
  .msg p { font-size: 34px; color: var(--muted); margin: 30px 0 0; opacity: 0; transform: translateY(20px); }
  .scene.headline .msg .ln, .scene.headline .msg p { animation: msgin 1s var(--md) var(--ease-out) forwards; }
  @keyframes msgin { to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

  <div class="viewport">
    <div class="stage" id="stage">

      <!-- 1 · Question -->
      <section class="slide" data-title="How do you work nowadays?">
        <div class="qmark" aria-hidden="true"><span class="q">?</span></div>
        <div class="q-top">
          <img class="in" style="--d:.1s" src="../assets/logos/cosys.svg" alt="Cosys Computer Systems">
          <span class="kicker in" style="--d:.2s">About you</span>
        </div>
        <h1 class="question">
          <span class="l"><span class="muted" style="--d:.25s">How do you</span></span>
          <span class="l"><span style="--d:.4s">work</span></span>
          <span class="l"><span class="grad-text" style="--d:.55s">nowadays?</span></span>
        </h1>
      </section>

      <!-- 2 · AI box -->
      <section class="slide" data-title="AI breaks out" id="boxSlide">
        <div class="scene" id="scene" title="Click to replay">
          <div class="center">
            <div class="rays"></div>
            <div class="halo"></div>
            <div class="boxwrap" id="boxwrap">
              <div class="shadow" id="shadow"></div>
              <div class="cube">
                <div class="face back"></div>
                <div class="face left"></div>
                <div class="face bottom"></div>
                <div class="face right"></div>
                <div class="face front"><span class="ai grad-text">AI</span></div>
                <div class="face lid" id="lid"></div>
              </div>
            </div>
            <div class="ring" id="ring"></div>
            <div class="core grad-text" id="core">AI</div>
          </div>
          <div class="flash" id="flash"></div>
          <canvas class="fx" id="fx" width="3200" height="1800"></canvas>
          <div id="ideas"></div>
          <div class="msg">
            <h3><span class="ln" style="--md:.2s">Yesterday’s “not worth it”</span><span class="ln" style="--md:.45s">is today’s <span class="grad-text">quick win.</span></span></h3>
            <p style="--md:1.1s">The excuses have run out.</p>
          </div>
          <div class="hint">click to replay</div>
        </div>
      </section>

    </div>
  </div>

<script>
/* ===================== AI box: shake → burst → ideas ===================== */
const scene = document.getElementById('scene');
const boxwrap = document.getElementById('boxwrap');
const lid = document.getElementById('lid');
const shadow = document.getElementById('shadow');
const ring = document.getElementById('ring');
const core = document.getElementById('core');
const flash = document.getElementById('flash');
const ideasEl = document.getElementById('ideas');
const faces = [...document.querySelectorAll('.cube .face:not(.lid)')];
const CX = 800, CY = 470;

const IDEAS = [
  ['💡', 'New idea'], ['🚀', 'Ship faster'], ['🎨', 'Design'], ['🧪', 'Experiment'],
  ['🧩', 'Prototype'], ['📊', 'Insights'], ['🤖', 'Automate'], ['✍️', 'Draft'],
  ['🔍', 'Research'], ['🛠️', 'Build'], ['🎯', 'Focus'], ['🗺️', 'Plan'],
  ['🧠', 'Learn'], ['💬', 'Brainstorm'], ['⚡', 'Speed up'], ['🔁', 'Iterate'],
];
const BUBBLES = ['🌈', '✨', '🎵', '🦄', '🔮', '🎲', '🌱', '🍀'];
const HUES = [165, 255, 320, 35, 195, 120, 285, 5, 50, 220, 145, 340];

/* ---- canvas particles ---- */
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
ctx.scale(2, 2);
let parts = [], rafOn = false;
const rnd = (a, b) => a + Math.random() * (b - a);
function loop() {
  ctx.clearRect(0, 0, 1600, 900);
  parts = parts.filter(p => p.t < p.life);
  for (const p of parts) {
    p.t++; p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    const fade = Math.min(1, (p.life - p.t) / 30);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(p.x, p.y);
    if (p.kind === 'spark') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(0, 0, p.s, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.t * p.flip));
      ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s * .55, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.s / 2, -p.s * .8, p.s, p.s * 1.6);
    }
    ctx.restore();
  }
  if (parts.length) requestAnimationFrame(loop); else { rafOn = false; ctx.clearRect(0, 0, 1600, 900); }
}
function emit(list) { parts.push(...list); if (!rafOn) { rafOn = true; requestAnimationFrame(loop); } }
function sparks(n, spread = 140) {
  emit(Array.from({ length: n }, () => ({
    kind: 'spark', x: CX + rnd(-spread, spread), y: CY - 150 + rnd(-12, 12),
    vx: rnd(-3.5, 3.5), vy: rnd(-9, -3), g: .32, drag: .97, s: rnd(1.5, 3.2),
    c: `hsl(${rnd(30, 55)} 100% ${rnd(65, 85)}%)`, t: 0, life: rnd(30, 60), rot: 0, vr: 0,
  })));
}
function confetti(n) {
  emit(Array.from({ length: n }, () => {
    const a = rnd(0, Math.PI * 2), v = rnd(7, 24);
    return {
      kind: 'confetti', x: CX + rnd(-30, 30), y: CY + rnd(-30, 30),
      vx: Math.cos(a) * v * 1.25, vy: Math.sin(a) * v - rnd(3, 8), g: .22, drag: .975,
      s: rnd(8, 15), round: Math.random() < .3, c: `hsl(${HUES[Math.floor(Math.random() * HUES.length)]} 90% ${rnd(58, 72)}%)`,
      t: 0, life: rnd(150, 240), rot: rnd(0, 6), vr: rnd(-.25, .25), flip: rnd(.05, .2),
    };
  }));
}

/* ---- idea targets: two loose elliptical rings around the centre ---- */
function layout() {
  const items = [];
  const ring1 = 10, ring2 = 14;
  let chip = 0, bub = 0;
  const pick = (preferBubble) => (preferBubble && bub < BUBBLES.length) || chip >= IDEAS.length
    ? { bubble: BUBBLES[bub++] } : { chip: IDEAS[chip++] };
  for (let i = 0; i < ring1; i++) {
    const a = (i / ring1) * Math.PI * 2 + rnd(-.12, .12) - Math.PI / 2;
    items.push({ ...pick(i % 2 === 1), x: CX + Math.cos(a) * 395, y: CY + Math.sin(a) * 235 });
  }
  for (let i = 0; i < ring2; i++) {
    const a = ((i + .5) / ring2) * Math.PI * 2 + rnd(-.08, .08) - Math.PI / 2;
    items.push({ ...pick(i % 5 === 2), x: CX + Math.cos(a) * 640, y: CY + Math.sin(a) * 352 });
  }
  return items;
}

/* ---- sequencing helpers ---- */
let runId = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
const play = (el, kf, opt) => el.animate(kf, { fill: 'forwards', ...opt }).finished.catch(() => {});
const heat = v => scene.style.setProperty('--heat', v);
const LID = 'rotateX(90deg) translateZ(120px)';
const lidBump = (h, tilt, d = 380) => play(lid, [
  { transform: LID },
  { transform: `rotateX(90deg) translateZ(${120 + h}px) rotateY(${tilt}deg)`, offset: .3 },
  { transform: LID },
], { duration: d, easing: 'ease-out' });

function reset() {
  runId++;
  scene.querySelectorAll('*').forEach(el => el.getAnimations().forEach(a => a.cancel()));
  ideasEl.innerHTML = '';
  parts = [];
  core.classList.remove('on');
  scene.classList.remove('done', 'headline');
  scene.style.transition = 'none'; heat(0); scene.offsetWidth; scene.style.transition = '';
}

async function run() {
  reset();
  const id = runId, alive = () => id === runId;

  // 1. box arrives
  await play(boxwrap, [
    { transform: 'translateY(-80px) scale(.6)', opacity: 0 },
    { transform: 'translateY(0) scale(1)', opacity: 1 },
  ], { duration: 750, easing: 'cubic-bezier(.2,1.4,.4,1)' });
  if (!alive()) return; await wait(250); if (!alive()) return;

  // 2. a curious wobble
  heat(.12);
  await play(boxwrap, [
    { transform: 'rotate(0)' }, { transform: 'rotate(-4deg)' }, { transform: 'rotate(4deg)' },
    { transform: 'rotate(-2.5deg)' }, { transform: 'rotate(0)' },
  ], { duration: 700, easing: 'ease-in-out', fill: 'none' });
  if (!alive()) return; await wait(420); if (!alive()) return;

  // 3. something knocks from inside — twice
  heat(.35); sparks(14, 90);
  lidBump(26, 6);
  await play(boxwrap, [
    { transform: 'translate(0,0) rotate(0)' }, { transform: 'translate(6px,-20px) rotate(5deg)', offset: .3 }, { transform: 'translate(0,0) rotate(0)' },
  ], { duration: 380, easing: 'ease-out', fill: 'none' });
  if (!alive()) return; await wait(300); if (!alive()) return;

  heat(.5); sparks(22, 120);
  lidBump(40, -9);
  await play(boxwrap, [
    { transform: 'translate(0,0) rotate(0)' }, { transform: 'translate(-10px,-30px) rotate(-7deg)', offset: .3 }, { transform: 'translate(0,0) rotate(0)' },
  ], { duration: 400, easing: 'ease-out', fill: 'none' });
  if (!alive()) return; await wait(180); if (!alive()) return;

  // 4. a hop with squash & stretch
  heat(.68); sparks(28, 140);
  lidBump(55, 10, 520);
  play(shadow, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.7)', opacity: .5, offset: .45 }, { transform: 'scale(1)', opacity: 1 }], { duration: 520, fill: 'none' });
  await play(boxwrap, [
    { transform: 'translateY(0) scale(1,1)' },
    { transform: 'translateY(8px) scale(1.08,.9)', offset: .15 },
    { transform: 'translateY(-70px) scale(.94,1.08)', offset: .45 },
    { transform: 'translateY(6px) scale(1.1,.9)', offset: .8 },
    { transform: 'translateY(0) scale(1,1)' },
  ], { duration: 520, easing: 'ease-in-out', fill: 'none' });
  if (!alive()) return; await wait(120); if (!alive()) return;

  // 5. rattling, bulging, about to give
  heat(1);
  const N = 26, rattle = [];
  for (let i = 0; i <= N; i++) {
    const k = i / N, amp = 3 + k * 13, s = 1 + k * .14;
    rattle.push({ transform: i === N ? `scale(${s})` : `translate(${rnd(-amp, amp)}px,${rnd(-amp, amp)}px) rotate(${rnd(-amp, amp) * .5}deg) scale(${s + rnd(-.02, .02)}, ${s - rnd(0, .03)})` });
  }
  const lidRattle = Array.from({ length: 14 }, (_, i) => ({ transform: `rotateX(90deg) translateZ(${120 + rnd(4, 18 + i * 2)}px) rotateY(${rnd(-10, 10)}deg)` }));
  lidRattle.push({ transform: `rotateX(90deg) translateZ(150px)` });
  play(lid, lidRattle, { duration: 1150 });
  const sparkTimer = setInterval(() => alive() ? sparks(8, 150) : clearInterval(sparkTimer), 90);
  await play(boxwrap, rattle, { duration: 1150, easing: 'linear' });
  clearInterval(sparkTimer);
  if (!alive()) return;

  // 6. BURST
  burst();
}

function burst() {
  const id = runId;
  play(flash, [{ opacity: 0 }, { opacity: .95, offset: .12 }, { opacity: 0 }], { duration: 700, easing: 'ease-out' });
  play(ring, [{ transform: 'scale(.3)', opacity: 1 }, { transform: 'scale(7)', opacity: 0 }], { duration: 900, easing: 'cubic-bezier(.1,.8,.3,1)' });
  play(shadow, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 });
  play(lid, [
    { transform: 'rotateX(90deg) translateZ(150px)', opacity: 1 },
    { transform: `rotateX(90deg) translateZ(1100px) rotateY(${rnd(300, 520)}deg) rotateX(${rnd(-200, 200)}deg)`, opacity: 0 },
  ], { duration: 1100, easing: 'cubic-bezier(.15,.7,.3,1)' });
  const base = ['rotateY(180deg)', 'rotateY(-90deg)', 'rotateX(-90deg)', 'rotateY(90deg)', ''];
  faces.forEach((f, i) => {
    const b = base[i] ?? '';
    play(f, [
      { transform: `${b} translateZ(120px)`, opacity: 1 },
      { transform: `${b} translateZ(${rnd(600, 900)}px) rotateX(${rnd(-160, 160)}deg) rotateZ(${rnd(-90, 90)}deg)`, opacity: 0 },
    ], { duration: rnd(800, 1100), easing: 'cubic-bezier(.15,.7,.3,1)' });
  });
  heat(.2);
  confetti(280);
  sparks(60, 60);

  // the AI core stays, glowing
  play(core, [{ transform: 'scale(.3)', opacity: 0 }, { transform: 'scale(1.12)', opacity: 1, offset: .6 }, { transform: 'scale(1)', opacity: 1 }],
    { duration: 900, delay: 120, easing: 'cubic-bezier(.2,1.2,.4,1)' }).then(() => { if (id === runId) core.classList.add('on'); });

  // ideas fly out
  layout().forEach((it, i) => {
    const h = HUES[i % HUES.length];
    const wrap = document.createElement('div');
    wrap.className = 'idea';
    const bob = document.createElement('div');
    bob.className = 'bob';
    bob.style.cssText = `--bd:${rnd(3, 5.5).toFixed(2)}s;--bdel:${rnd(-4, 0).toFixed(2)}s;--tilt:${rnd(-7, 7).toFixed(1)}deg`;
    const el = document.createElement('div');
    el.style.setProperty('--h', h);
    if (it.chip) { el.className = 'chip'; el.innerHTML = `<span class="e">${it.chip[0]}</span>${it.chip[1]}`; }
    else { el.className = 'bubble'; el.textContent = it.bubble; }
    bob.appendChild(el); wrap.appendChild(bob); ideasEl.appendChild(wrap);
    const spin = rnd(-540, 540);
    wrap.animate([
      { transform: `translate(${CX}px,${CY}px) scale(.15) rotate(${spin}deg)`, opacity: 0 },
      { opacity: 1, offset: .12 },
      { transform: `translate(${it.x}px,${it.y}px) scale(1) rotate(0deg)`, opacity: 1 },
    ], { duration: rnd(900, 1400), delay: 60 + i * 28, easing: 'cubic-bezier(.12,.9,.25,1.12)', fill: 'both' });
  });
  setTimeout(() => { if (id === runId) scene.classList.add('done'); }, 2400);
  // let the ideas land, then bring the message forward
  setTimeout(() => {
    if (id !== runId) return;
    core.classList.remove('on');
    play(core, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.25)' }], { duration: 800, easing: 'ease-in' });
    scene.classList.add('headline');
  }, 2900);
}

const boxSlide = document.getElementById('boxSlide');
boxSlide.addEventListener('slideenter', () => run());
boxSlide.addEventListener('slideleave', () => reset());
scene.addEventListener('click', () => run());
document.addEventListener('keydown', e => { if (e.key === 'r' && boxSlide.classList.contains('active')) run(); });
</script>
<script src="../assets/deck.js"></script>
</body>
