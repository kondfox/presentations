<title>Workflows — AI Training session</title>

<style>
  /* ---------- Slide 1: overview ---------- */
  .intro h1 { font-family: var(--display); font-weight: 700; font-size: 132px; letter-spacing: -.045em; line-height: .9; margin: 18px 0 0; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 64px; }
  .wcard {
    position: relative; display: flex; flex-direction: column; height: 470px; border-radius: 24px; overflow: hidden; cursor: pointer;
    background: var(--glass); border: 1px solid var(--line); text-align: left; color: inherit; font: inherit; padding: 0;
    transition: transform .5s var(--ease-out), border-color .3s;
  }
  .wcard:hover { transform: translateY(-6px); border-color: var(--line-strong); }
  .wcard .thumb { position: relative; flex: 1; overflow: hidden; background: rgba(0,0,0,.25); }
  .wcard .thumb img { position: absolute; left: 50%; top: 0; width: 100%; translate: -50% 0; transition: transform 6s linear; }
  .wcard .thumb.tall img { width: 70%; }
  .wcard:hover .thumb img { transform: translateY(-30%); }
  .wcard .thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(13,15,22,.95)); }
  .wcard .meta { padding: 22px 26px 26px; }
  .wcard .num { font-family: var(--mono); font-size: 13px; letter-spacing: .14em; color: var(--muted); }
  .wcard h3 { font-family: var(--display); font-size: 30px; letter-spacing: -.02em; margin: 8px 0 6px; }
  .wcard p { margin: 0; color: var(--muted); font-size: 15px; }

  /* ---------- Workflow slides: camera over an inline SVG ---------- */
  .slide.wf { padding: 0; overflow: hidden; cursor: grab; }
  .slide.wf.dragging { cursor: grabbing; }
  .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .cam.anim { transition: transform 1.25s cubic-bezier(.65, 0, .35, 1); }
  .cam svg { display: block; }
  .wf .fade-top { position: absolute; left: 0; right: 0; top: 0; height: 170px; pointer-events: none;
                  background: linear-gradient(var(--bg) 10%, rgba(7,8,12,.75) 50%, transparent); }
  .hud { position: absolute; left: 56px; top: 40px; pointer-events: none; }
  .hud .kicker { display: block; }
  .hud .cap { font-family: var(--display); font-weight: 700; font-size: 40px; letter-spacing: -.02em; margin-top: 10px;
              transition: opacity .35s, transform .5s var(--ease-out); }
  .hud .cap.swap { opacity: 0; transform: translateY(8px); }
  .pips { display: flex; gap: 6px; margin-top: 14px; }
  .pips i { width: 18px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.15); transition: background .3s, width .4s var(--ease-out); }
  .pips i.on { background: var(--mint); width: 30px; }

  .minimap {
    position: absolute; right: 32px; bottom: 70px; border-radius: 12px; overflow: hidden; pointer-events: none;
    background: rgba(10,12,20,.8); border: 1px solid var(--line-strong); box-shadow: 0 20px 40px -16px rgba(0,0,0,.7);
  }
  .minimap { transition: opacity .5s; }
  .minimap.hide { opacity: 0; }
  .minimap img { display: block; width: 100%; height: 100%; opacity: .75; }
  .minimap .vp { position: absolute; border: 2px solid var(--mint); border-radius: 3px; background: rgba(124,243,208,.08);
                 box-shadow: 0 0 0 999px rgba(7,8,12,.35); transition: all 1.25s cubic-bezier(.65,0,.35,1); }
  .dragging .minimap .vp, .minimap .vp.free { transition: none; }
  .wf .help { position: absolute; right: 32px; top: 44px; font-size: 12.5px; color: var(--faint); pointer-events: none; text-align: right; line-height: 1.6; }
  .active .help { animation: helpout .8s 5s forwards; }
  @keyframes helpout { to { opacity: 0; } }
  .wf .help kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }
</style>
</head>

, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">3. prototype acceptance — backlog only on an accepted one</text><text x="0" y="92.62" font-family="Excalifont-offer, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">4. chapter plan — approve the skeleton, not the text</text></g><g transform="translate(1998.2097100539663 810) rotate(0 88.20000000000005 22.5)"><text x="0" y="31.716" font-family="Excalifont-offer, Xiaolai, Segoe UI Emoji" font-size="36px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Principles</text></g><g transform="translate(1998.2097100539663 870) rotate(0 279.29999999999995 75)"><text x="0" y="17.619999999999997" font-family="Excalifont-offer, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- credibility comes from specifics, not adjectives</text><text x="0" y="42.62" font-family="Excalifont-offer, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- client said it ≠ we discovered it ([Ü] / [F] / [SZ])</text><text x="0" y="67.62" font-family="Excalifont-offer, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- internal loops are never "agreed with the client"</text><text x="0" y="92.62" font-family="Excalifont-offer, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- uncertainty is bounded, not hidden</text><text x="0" y="117.62" font-family="Excalifont-offer, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- what a machine can check, a machine checks</text><text x="0" y="142.62" font-family="Excalifont-offer, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- one language first (HU), translation is a separate step</text></g><g transform="translate(1998.2097100539663 1090) rotate(0 185.22000000000003 22.5)"><text x="0" y="31.716" font-family="Excalifont-offer, Xiaolai, Segoe UI Emoji" font-size="36px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Standalone milestones</text></g><g transform="translate(1998.2097100539663 1150) rotate(0 323.4000000000001 37.5)"><text x="0" y="17.619999999999997" font-family="Excalifont-offer, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">/gai:brd-prd → /gai:prototype → /gai:backlog → /gai:estimation</text><text x="0" y="42.62" font-family="Excalifont-offer, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- each stops at its milestone; the orchestrator resumes from runs/</text><text x="0" y="67.62" font-family="Excalifont-offer, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e6e8ef" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">/gai:solverx — quick order-of-magnitude duration (weeks), no offer</text></g></svg></div>

<script>
/* =====================================================================
   Camera stops per workflow.
   r = [x, y, w, h] focus rectangle in "preview pixels" (the drawing scaled to
   pw pixels wide); null = whole drawing. t = caption shown top-left.
   → / Space walks the stops; drag to pan, scroll to zoom, 0 = back to the stop.
   ===================================================================== */
const WF = {
  dev: { kicker: 'Workflows · Development', pw: 2000, stops: [
    { r: null,                    t: 'Three ways of working' },
    { r: [-100,   0, 720, 405],   t: 'How I work nowadays · July 2026' },
    { r: [-100, 330, 720, 405],   t: 'How I work nowadays · July 2026' },
    { r: [-100, 600, 720, 405],   t: 'How I work nowadays · July 2026' },
    { r: [ 595,   0, 720, 405],   t: 'How I work nowadays · October 2026' },
    { r: [ 595, 430, 720, 405],   t: 'How I work nowadays · October 2026' },
    { r: [1010,  40, 900, 506],   t: 'Guardrails · Feedback loops & memory' },
    { r: [1415,   0, 720, 405],   t: 'How Uncle Bob works · August 2026' },
    { r: [1415, 300, 720, 405],   t: 'How Uncle Bob works · August 2026' },
    { r: [1415, 590, 720, 405],   t: 'How Uncle Bob works · August 2026' },
    { r: null,                    t: 'Three ways of working' },
  ]},
  legacy: { kicker: 'Workflows · Legacy', pw: 1000, stops: [
    { r: null,                   t: 'How we modernise legacy' },
    { r: [ 90,    0, 900, 506],  t: 'Intake & assessment' },
    { r: [ 90,  400, 820, 461],  t: 'Scope & rules' },
    { r: [  0,  740, 820, 461],  t: 'Spec, unit by unit' },
    { r: [  0, 1080, 820, 461],  t: 'Unit state & synthesis' },
    { r: [ 90, 1250, 820, 461],  t: 'Rebuild: brief → transform → verify' },
    { r: null,                   t: 'How we modernise legacy' },
  ]},
  offer: { kicker: 'Workflows · Offers', pw: 1000, stops: [
    { r: null,                   t: 'How we create offers' },
    { r: [150,    0, 700, 394],  t: 'Client need → scope' },
    { r: [440,  -20, 860, 484],  t: 'Legend · Hard stops · Principles' },
    { r: [150,  360, 700, 394],  t: 'Prototype loop' },
    { r: [  0,  640, 760, 427],  t: 'Backlog → estimate & proposal' },
    { r: [ 80,  960, 760, 427],  t: 'Chapters → offer sent' },
    { r: null,                   t: 'How we create offers' },
  ]},
};

const W = 1600, H = 900;
const stageEl = document.getElementById('stage');

document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => deck.go(Number(b.dataset.go))));

document.querySelectorAll('.slide.wf').forEach(slide => {
  const cfg = WF[slide.dataset.wf];
  const svg = slide.querySelector('svg');
  const SW = svg.viewBox.baseVal.width, SH = svg.viewBox.baseVal.height;
  const f = SW / cfg.pw;
  slide.dataset.steps = cfg.stops.length;

  // chrome: fade, HUD, minimap, help
  slide.insertAdjacentHTML('beforeend', `
    <div class="fade-top"></div>
    <div class="hud"><span class="kicker">${cfg.kicker}</span><div class="cap"></div><div class="pips">${cfg.stops.map(() => '<i></i>').join('')}</div></div>
    <div class="help"><kbd>→</kbd> next part · drag to pan · scroll to zoom · <kbd>0</kbd> reset</div>
    <div class="minimap"><img src="assets/${slide.dataset.wf}.svg" alt=""><div class="vp"></div></div>`);
  const cam = slide.querySelector('.cam'), cap = slide.querySelector('.cap'), pips = [...slide.querySelectorAll('.pips i')];
  const mm = slide.querySelector('.minimap'), vp = mm.querySelector('.vp');
  const mmScale = Math.min(230 / SW, 230 / SH);
  mm.style.width = SW * mmScale + 'px'; mm.style.height = SH * mmScale + 'px';

  const view = { x: 0, y: 0, s: 1 };       // top-left of the view in SVG units + zoom
  function fitRect(r) {
    const [rx, ry, rw, rh] = r ? r.map(v => v * f) : [-SW * .04, -SH * .04, SW * 1.08, SH * 1.08];
    const s = Math.min(W / rw, (H - (r ? 0 : 120)) / rh);
    return { s, x: rx + rw / 2 - W / 2 / s, y: ry + rh / 2 - (H + (r ? 0 : 60)) / 2 / s };
  }
  function apply(animate) {
    cam.classList.toggle('anim', animate);
    vp.classList.toggle('free', !animate);
    cam.style.transform = `scale(${view.s}) translate(${-view.x}px, ${-view.y}px)`;
    vp.style.left = view.x * mmScale + 'px'; vp.style.top = view.y * mmScale + 'px';
    vp.style.width = W / view.s * mmScale + 'px'; vp.style.height = H / view.s * mmScale + 'px';
  }
  let cur = 0, lastCap = '';
  function goStop(i, animate = true) {
    cur = i;
    Object.assign(view, fitRect(cfg.stops[i].r));
    apply(animate);
    pips.forEach((p, k) => p.classList.toggle('on', k === i));
    mm.classList.toggle('hide', !cfg.stops[i].r);   // no minimap on the overview stops
    const t = cfg.stops[i].t;
    if (t !== lastCap) {
      cap.classList.add('swap');
      setTimeout(() => { cap.textContent = t; cap.classList.remove('swap'); }, lastCap ? 250 : 0);
      lastCap = t;
    }
  }
  slide.addEventListener('slidestep', e => goStop(e.detail - 1, slide.classList.contains('active') && cam.dataset.ready === '1'));
  slide.addEventListener('slideenter', () => { cam.dataset.ready = '1'; });
  goStop(0, false);

  // free exploration: drag to pan, wheel to zoom around the pointer
  const k = () => stageEl.getBoundingClientRect().width / W;   // stage scale on screen
  let drag = null;
  slide.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; slide.classList.add('dragging'); slide.setPointerCapture(e.pointerId); });
  slide.addEventListener('pointermove', e => {
    if (!drag) return;
    view.x -= (e.clientX - drag.x) / k() / view.s; view.y -= (e.clientY - drag.y) / k() / view.s;
    drag = { x: e.clientX, y: e.clientY }; apply(false);
  });
  const end = () => { drag = null; slide.classList.remove('dragging'); };
  slide.addEventListener('pointerup', end); slide.addEventListener('pointercancel', end);
  slide.addEventListener('wheel', e => {
    e.preventDefault();
    const r = stageEl.getBoundingClientRect();
    const px = (e.clientX - r.left) / k(), py = (e.clientY - r.top) / k();
    const gx = view.x + px / view.s, gy = view.y + py / view.s;
    view.s = Math.min(4, Math.max(.15, view.s * Math.exp(-e.deltaY * .0015)));
    view.x = gx - px / view.s; view.y = gy - py / view.s; apply(false);
  }, { passive: false });
  document.addEventListener('keydown', e => { if (e.key === '0' && slide.classList.contains('active')) goStop(cur); });
});
</script>
