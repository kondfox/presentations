<style>
  .slide.diagram-slide { padding: 0; }
  .diagram { position: absolute; inset: 0; font-family: var(--body); }
  .diagram text { font-family: var(--body); }
  .diagram .ttl, .diagram .lead { font-family: var(--display); letter-spacing: -.01em; }
  .diagram .kick { font-family: var(--mono); font-size: 13px; letter-spacing: .18em; fill: var(--muted); }

  /* panels sit on a faint glass so the aurora stays behind them */
  .diagram rect[stroke-opacity="0.12"] { fill: rgba(10, 12, 20, .55); }

  /* build steps: every group fades/slides in after its delay once its step is reached */
  .diagram .f { opacity: 0; transform: translateY(10px); transform-box: fill-box;
                transition: opacity .35s ease, transform .35s ease; }
  .step-1 .s1.f, .step-2 .s2.f, .step-3 .s3.f {
    opacity: 1; transform: none;
    transition: opacity .7s var(--ease-out) var(--d), transform .8s var(--ease-out) var(--d);
  }
  /* solid arrows draw themselves */
  .diagram .draw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .2s; }
  .step-1 .s1 .draw, .step-2 .s2 .draw, .step-3 .s3 .draw {
    stroke-dashoffset: 0; transition: stroke-dashoffset .7s ease-out calc(var(--d) + .1s);
  }
  /* dashed zoom-out connectors march slowly */
  .diagram .ants { animation: ants 1.6s linear infinite; }
  @keyframes ants { to { stroke-dashoffset: -12; } }
  /* travelling pulse along the flow */
  .diagram .pulse { filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px #4fb3d0); }
</style>
</head>
