<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Training session — Péter Tamás</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* ---------- Title block (top-left) ---------- */
  .title {
    position: fixed; z-index: 3; left: clamp(20px, 5vw, 80px); top: clamp(24px, 6vh, 64px);
    pointer-events: none;
  }
  .title .live { display: inline-flex; align-items: center; gap: 10px; }
  .title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); animation: ping 2.4s var(--ease-out) infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(124,243,208,.55); } 80%, 100% { box-shadow: 0 0 0 12px rgba(124,243,208,0); } }
  .title h1 {
    font-family: var(--display); font-weight: 700; letter-spacing: -.035em; line-height: .92;
    font-size: clamp(40px, min(6.6vw, 11vh), 104px); margin: 18px 0 0;
  }
  .title h1 .line { display: block; overflow: hidden; padding-bottom: .06em; }
  .title h1 .line > span { display: inline-block; transform: translateY(105%); animation: rise 1.1s var(--ease-out) forwards; }
  .title h1 .line:nth-child(2) > span { animation-delay: .12s; }
  @keyframes rise { to { transform: none; } }
  .title .meta { margin-top: 18px; color: var(--muted); font-size: 16px; }
  .title .meta b { color: var(--fg); font-weight: 500; }
  .reveal { opacity: 0; animation: fade .9s var(--ease-out) forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .brand { position: fixed; z-index: 3; right: clamp(20px, 5vw, 80px); top: clamp(28px, 6vh, 64px); height: clamp(40px, 6vh, 56px); opacity: .9; }

  /* ---------- Topic space ---------- */
  .space { position: fixed; inset: 0; z-index: 2; }
  .ring {
    position: absolute; border-radius: 50%; border: 1px dashed rgba(255,255,255,.07);
    transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none;
    animation: ringin 2s var(--d) var(--ease-out) forwards, turn 120s linear infinite;
  }
  @keyframes ringin { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes turn { to { rotate: 360deg; } }

  .node {                       /* positioned + parallax layer */
    position: absolute; width: 0; height: 0;
    transform: translate(calc(var(--px, 0) * var(--z) * 1px), calc(var(--py, 0) * var(--z) * 1px));
    transition: transform 1.2s var(--ease-out);
  }
  .node .float {                /* idle bobbing layer */
    position: absolute; left: 0; top: 0; translate: -50% -50%;
    animation: bob var(--fd, 7s) var(--fdel, 0s) ease-in-out infinite alternate;
  }
  @keyframes bob { from { transform: translate(0, -7px); } to { transform: translate(var(--fx, 4px), 8px); } }

  .topic {
    --size: clamp(78px, 12.5vh, 118px);
    display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit;
    width: 240px; text-align: center; outline: none;
    opacity: 0; transform: scale(.4); filter: blur(10px);
    animation: popin 1.1s var(--in) cubic-bezier(.2,1.25,.4,1) forwards;
  }
  @keyframes popin { to { opacity: 1; transform: none; filter: none; } }
  .topic.main { --size: clamp(110px, 18vh, 168px); }

  .orb {
    position: relative; width: var(--size); height: var(--size); border-radius: 50%;
    transition: transform .6s var(--ease-out);
  }
  .orb::before {                /* halo */
    content: ""; position: absolute; inset: -22%; border-radius: 50%;
    background: radial-gradient(circle, hsl(var(--h) 90% 65% / .45), transparent 65%);
    filter: blur(8px); opacity: .55; transition: opacity .5s, transform .6s var(--ease-out);
  }
  .orb .core {
    position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    background:
      radial-gradient(circle at 32% 28%, hsl(var(--h) 100% 88%) 0%, hsl(var(--h) 85% 62%) 22%, hsl(calc(var(--h) + 40) 70% 32%) 62%, hsl(calc(var(--h) + 60) 60% 12%) 100%);
    box-shadow: inset -10px -14px 30px rgba(0,0,0,.45), inset 6px 8px 20px rgba(255,255,255,.18), 0 20px 50px -18px hsl(var(--h) 80% 50% / .6);
  }
  .orb .core img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .orb .core img.logo { object-fit: contain; padding: 12%; position: relative; z-index: 1; filter: drop-shadow(0 2px 8px rgba(0,0,0,.35)); }
  .orb .core::after {           /* glass sheen on top of photos too */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.35), transparent 38%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
  }
  .orb .glyph {
    position: absolute; inset: 0; display: grid; place-items: center; z-index: 1;
    font-family: var(--display); font-weight: 700; font-size: calc(var(--size) * .34); color: rgba(255,255,255,.92);
    text-shadow: 0 2px 12px rgba(0,0,0,.35);
  }
  .orb .spin {                  /* orbiting dot ring, shown on hover */
    position: absolute; inset: -14px; border-radius: 50%; border: 1px solid hsl(var(--h) 90% 70% / .35);
    opacity: 0; transform: scale(.85); transition: opacity .4s, transform .6s var(--ease-out);
  }
  .orb .spin::after {
    content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%;
    background: hsl(var(--h) 90% 75%); box-shadow: 0 0 12px hsl(var(--h) 90% 70%);
  }
  .topic:hover .orb, .topic:focus-visible .orb { transform: scale(1.08); }
  .topic:hover .orb::before, .topic:focus-visible .orb::before { opacity: 1; transform: scale(1.15); }
  .topic:hover .spin, .topic:focus-visible .spin { opacity: 1; transform: none; animation: turn 6s linear infinite; }

  .topic h2 {
    font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: -.015em; margin: 20px 0 0;
    transition: color .3s;
  }
  .topic.main h2 { font-size: 32px; }
  .topic p {
    margin: 6px 0 0; color: var(--muted); font-size: 14.5px; line-height: 1.45; max-width: 26ch;
    opacity: 0; transform: translateY(-6px); transition: opacity .35s, transform .5s var(--ease-out);
  }
  .topic:hover p, .topic:focus-visible p { opacity: 1; transform: none; }

  .tag {
    position: absolute; left: 50%; top: -34px; translate: -50% 0; white-space: nowrap;
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px; color: var(--bg); background: var(--mint);
  }
  .visited-mark {
    position: absolute; right: 4%; bottom: 4%; z-index: 2; width: 30%; max-width: 34px; aspect-ratio: 1; border-radius: 50%;
    display: none; place-items: center; background: var(--fg); color: var(--bg);
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .topic.visited .visited-mark { display: grid; }
  .topic.visited h2 { color: var(--muted); }

  .placeholder .orb .core { filter: saturate(.5) brightness(.75); }

  /* ---------- Footer ---------- */
  footer {
    position: fixed; z-index: 3; left: clamp(20px, 5vw, 80px); right: clamp(20px, 5vw, 80px); bottom: 22px;
    display: flex; justify-content: space-between; gap: 16px; color: var(--faint); font-size: 13px;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--fg); }
  footer button { font: inherit; color: var(--faint); background: none; border: 0; cursor: pointer; padding: 0; }
  footer button:hover { color: var(--muted); }

  /* ---------- Narrow screens: a loose, staggered flow instead of absolute space ---------- */
  /* ---------- QR to these slides ---------- */
  .selfqr { position: fixed; z-index: 3; left: clamp(20px, 5vw, 80px); bottom: 64px; display: flex; align-items: center; gap: 14px;
            padding: 10px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); text-decoration: none; color: inherit;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: border-color .3s; }
  .selfqr:hover { border-color: var(--line-strong); }
  .selfqr .qr { width: 118px; height: 118px; padding: 8px; border-radius: 10px; background: #fff; }
  .selfqr .qr svg { display: block; width: 100%; height: 100%; }
  @media (max-height: 820px) {
    .selfqr { bottom: 52px; padding: 6px; }
    .selfqr .qr { width: 84px; height: 84px; padding: 5px; }
  }

  @media (max-width: 760px), (max-height: 560px) {
    .selfqr { display: none; }
    body { overflow: auto; }
    .title, .brand, footer { position: relative; }
    .title { left: auto; top: auto; padding: 28px 16px 0; }
    .brand { position: absolute; top: 32px; right: 16px; height: 22px; }
    .space { position: relative; inset: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 28px 8px; padding: 64px 16px 40px; }
    .ring { display: none; }
    .node { position: relative; width: auto; height: auto; left: auto !important; top: auto !important; transform: none; min-width: 0; }
    .node:has(.main) { grid-column: 1 / -1; }
    .node:nth-of-type(odd):not(:has(.main)) { margin-top: 44px; }
    .node .float { position: relative; left: auto; top: auto; translate: none; display: flex; justify-content: center; }
    .topic { width: 100%; max-width: 170px; --size: 92px; }
    .topic.main { max-width: 280px; --size: 132px; }
    .title .live { flex-wrap: wrap; font-size: 11px; }
    .topic p { opacity: 1; transform: none; }
    footer { left: auto; right: auto; bottom: auto; padding: 0 16px 24px; flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <canvas id="stars" aria-hidden="true"></canvas>

  <header class="title">
    <span class="live kicker reveal" style="animation-delay:.05s"><span class="dot"></span>Cosys Computer Systems SRL · 2 Nov 2026</span>
    <h1>
      <span class="line"><span>AI Training</span></span>
      <span class="line"><span class="grad-text">session</span></span>
    </h1>
    <div class="meta reveal" style="animation-delay:.45s">with <b>Péter Tamás</b> · Attrecto</div>
  </header>
  <img class="brand reveal" style="animation-delay:.3s" src="assets/logos/attrecto-white-trim.png" alt="Attrecto">

  <main class="space" id="space"></main>

  <a class="selfqr reveal" aria-label="These slides: kondfox.github.io/presentations/20261102_Cosys_Training" style="animation-delay:1.2s" href="https://kondfox.github.io/presentations/20261102_Cosys_Training/" target="_blank" rel="noopener">
    <div class="qr" data-qr="https://kondfox.github.io/presentations/20261102_Cosys_Training/"></div>
  </a>

  <footer class="reveal" style="animation-delay:1.4s">
    <span>Péter Tamás · <a href="https://www.linkedin.com/in/tamas-peter-kond/">LinkedIn</a></span>
    <span><button id="reset" title="Clear the ✓ marks on visited topics">Reset visited</button> · <a href="../">All presentations →</a></span>
  </footer>

<script src="assets/qrcode.min.js"></script>
<script>
document.querySelectorAll('[data-qr]').forEach(el => {
  const q = qrcode(0, 'M'); q.addData(el.dataset.qr); q.make();
  el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
});
/* =====================================================================
   Topics. Order here only decides which free spot a topic takes —
   there is no implied sequence on the page.
     main:  true  → large orb with a "Start here" tag (use for About me)
     thumb: photo filling the orb  ·  logo: logo inside the orb  ·  glyph: short text/emoji
     hue:   orb colour (0–360)
   ===================================================================== */
const topics = [
  { title: 'About me', desc: 'Who is talking: career so far, family, and Bunsday.', href: 'about/', thumb: 'about/assets/avatar.jpg', hue: 165, main: true },
  { title: 'About you', desc: 'How do you work nowadays?', href: 'about-you/', logo: 'assets/logos/cosys.svg', hue: 225 },
  { title: 'AI glossary', desc: 'From one agent to a whole workflow: the words we will use.', href: 'ai-glossary/', glyph: 'Aa', hue: 42 },
  { title: 'Workflows', desc: 'Development, legacy modernisation and offers: how we work with agents.', href: 'workflows/', glyph: '⇄', hue: 140 },
  { title: 'Tools', desc: 'LLM Wiki · Merge Risk · Critics · Credential broker · Project metrics', href: 'tools/', glyph: '⚙', hue: 300 },
  { title: 'Automation', desc: '/peti · /campaign-config · bidding process automation', href: 'automation/', glyph: '⚡', hue: 190 },
  { title: 'Capabilities', desc: 'A music video, hobby projects and quick prototypes.', href: 'capabilities/', glyph: '✦', hue: 12 },
];

// Open the page with ?demo to preview how a full board will look.
if (new URLSearchParams(location.search).has('demo')) {
  const demo = ['Topic two', 'Topic three', 'Topic four', 'Topic five', 'Topic six', 'Topic seven', 'Topic eight', 'Topic nine'];
  const hues = [255, 320, 30, 200, 120, 280, 0, 50];
  demo.forEach((t, i) => topics.push({ title: t, desc: 'Placeholder topic, visible only in ?demo mode.', href: '#', glyph: String(i + 2), hue: hues[i], placeholder: true }));
}

/* Hand-placed spots (percent of the viewport) — scattered, roughly balanced,
   clear of the title block in the top-left. Main topic takes the first. */
const SPOTS = [
  [24, 66],                       // main
  [55, 26], [79, 28], [62, 55], [89, 50],
  [45, 80], [77, 81], [45, 46], [8, 86], [93, 83],
];
const DEPTH = [18, 10, 6, 14, 8, 12, 9, 16, 11, 7];   // parallax strength per spot

const space = document.getElementById('space');
let visited = [];
try { visited = JSON.parse(localStorage.getItem('cosys-visited') || '[]'); } catch (e) {}

// orbit rings around the main topic
const [mx, my] = SPOTS[0];
[300, 520].forEach((d, i) => {
  const r = document.createElement('div');
  r.className = 'ring';
  r.style.cssText = `left:${mx}%;top:${my}%;width:${d}px;height:${d}px;--d:${.4 + i * .2}s`;
  space.appendChild(r);
});

const check = '<svg width="60%" height="60%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ordered = [...topics.filter(t => t.main), ...topics.filter(t => !t.main)];
ordered.forEach((t, i) => {
  const [x, y] = SPOTS[i % SPOTS.length];
  const node = document.createElement('div');
  node.className = 'node';
  node.style.left = x + '%';
  node.style.top = y + '%';
  node.style.setProperty('--z', DEPTH[i % DEPTH.length]);

  const fl = document.createElement('div');
  fl.className = 'float';
  fl.style.setProperty('--fd', (6 + (i * 1.7) % 4).toFixed(1) + 's');
  fl.style.setProperty('--fdel', (-i * 1.3).toFixed(1) + 's');
  fl.style.setProperty('--fx', ((i % 2 ? -1 : 1) * (3 + i % 4)) + 'px');

  const a = document.createElement('a');
  a.className = 'topic' + (t.main ? ' main' : '') + (t.placeholder ? ' placeholder' : '') + (visited.includes(t.href) ? ' visited' : '');
  a.href = t.href;
  a.style.setProperty('--h', t.hue ?? (i * 47) % 360);
  a.style.setProperty('--in', (0.6 + i * 0.12).toFixed(2) + 's');
  a.innerHTML = `
    <div class="orb">
      ${t.main ? '<span class="tag">Start here</span>' : ''}
      <span class="spin"></span>
      <span class="core">${t.thumb ? `<img src="${t.thumb}" alt="">` : t.logo ? `<img class="logo" src="${t.logo}" alt="">` : ''}</span>
      ${t.glyph && !t.thumb ? `<span class="glyph">${t.glyph}</span>` : ''}
      <span class="visited-mark" title="Visited">${check}</span>
    </div>
    <h2>${t.title}</h2>
    ${t.desc ? `<p>${t.desc}</p>` : ''}`;
  a.addEventListener('click', () => {
    if (t.placeholder) return;
    try { localStorage.setItem('cosys-visited', JSON.stringify([...new Set([...visited, t.href])])); } catch (e) {}
  });
  fl.appendChild(a);
  node.appendChild(fl);
  space.appendChild(node);
});

document.getElementById('reset').onclick = () => {
  try { localStorage.removeItem('cosys-visited'); } catch (e) {}
  document.querySelectorAll('.topic.visited').forEach(el => el.classList.remove('visited'));
};

/* Parallax: nodes drift a little against the pointer, by depth */
addEventListener('pointermove', e => {
  const px = (e.clientX / innerWidth - 0.5) * -2;
  const py = (e.clientY / innerHeight - 0.5) * -2;
  document.querySelectorAll('.node').forEach(n => { n.style.setProperty('--px', px.toFixed(3)); n.style.setProperty('--py', py.toFixed(3)); });
});

/* Twinkling star dust */
(function stars() {
  const c = document.getElementById('stars'), ctx = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, pts = [];
  function size() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr;
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    const n = Math.round(innerWidth * innerHeight / 9000);
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.1 + .3) * dpr,
      p: Math.random() * Math.PI * 2, s: .4 + Math.random() * 1.2, v: (Math.random() - .5) * .06 * dpr,
    }));
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (const s of pts) {
      const a = .15 + .45 * (0.5 + 0.5 * Math.sin(t / 1000 * s.s + s.p));
      s.y += s.v; if (s.y < 0) s.y = H; if (s.y > H) s.y = 0;
      ctx.globalAlpha = a; ctx.fillStyle = '#dfe6ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  addEventListener('resize', size); size(); requestAnimationFrame(draw);
})();
</script>
</body>
</html>
